[workspace]
resolver = "2"
members = [
  "config",
  "core",
  "search",
  "nnue",
  "training",
  "uci", 
  "utils",
]

[workspace.package]
version = "2.0.1"
authors = ["Jørgen Hanssen"]
edition = "2024"
license = "GPL-3.0"
description = "A UCI chess engine written in Rust"
repository = "https://github.com/jorgenhanssen/grail"

[workspace.dependencies]
ahash = "0.8.12"
arrayvec = "0.7"
cozy-chess = "0.3.4"
chrono = "0.4"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
log = "0.4.32"
rand = "0.10.1"
rayon = "1.12.0"
simplelog = "0.12.2"
num_cpus = "1.17.0"
candle-core = "0.10.2"
candle-nn = "0.10.2"
indicatif = "0.18.4"
tempfile = "3.27"
hyperloglogplus = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
incremental = false

# Release build with debug symbols (samply).
[profile.profiling]
inherits = "release"
debug = true

# crates version of pyrrhic-rs is outdated, and the git version has a fix I need...
# Fixes an issue with aarch64 builds (needs c_char, but 0.2.0 hardcoded i8).
[patch.crates-io]
pyrrhic-rs = { git = "https://github.com/Algorhythm-sxv/pyrrhic-rs", rev = "961c059" }
