[workspace]
resolver = "2"
members = [
  "core",
  "search",
  "nnue",
  "training",
  "uci", 
  "utils",
]

[workspace.package]
version = "1.1.0"
authors = ["Jørgen Hanssen"]
edition = "2024"
license = "GPL-3.0"
description = "A UCI chess engine written in Rust"
repository = "https://github.com/jorgenhanssen/grail"

[workspace.dependencies]
ahash = "0.8.12"
arrayvec = "0.7"
cozy-chess = "0.3.4"
chrono = "0.4"
clap = { version = "4.5.57", features = ["derive"] }
ctrlc = "3.5.1"
log = "0.4.29"
rand = "0.9.2"
rayon = "1.11.0"
simplelog = "0.12.2"
num_cpus = "1.17.0"
candle-core = "0.9.2"
candle-nn = "0.9.2"
indicatif = "0.18.3"
tempfile = "3.24"
hyperloglogplus = "0.4"

[workspace.lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
incremental = false
