[package]
name = "nnue"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = { workspace = true }
repository = { workspace = true }

[dependencies]
search = { path = "../search" }
evaluation = { path = "../evaluation" }
hce = { path = "../hce" }
uci = { path = "../uci" }
utils = { path = "../utils" }

ahash = { workspace = true }
cozy-chess = { workspace = true }
chrono = { workspace = true }
ctrlc = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
num_cpus = { workspace = true }
simplelog = { workspace = true }
clap = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
indicatif = { workspace = true }
tempfile = { workspace = true }
hyperloglogplus = { workspace = true }

[target.'cfg(all(any(target_arch = "x86", target_arch = "x86_64"), target_feature = "bmi2"))'.dependencies]
cozy-chess = { workspace = true, features = ["pext"] }

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
]

[lib]
name = "nnue"

[[bin]]
name = "generate"
path = "src/bin/generate/main.rs"

[[bin]]
name = "train"
path = "src/bin/train/main.rs"

[lints]
workspace = true
