    "candle-core/cuda",
    "candle-nn/cuda",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
]

[lib]
name = "nnue"

[[bin]]
name = "nnue-analysis"
path = "src/bin/analysis/main.rs"

[lints]
workspace = true
