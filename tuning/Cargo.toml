[package]
name = "tuning"
description = "SPSA tuning for Grail"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
config = { path = "../config" }
search = { path = "../search" }
nnue = { path = "../nnue" }
uci = { path = "../uci" }
utils = { path = "../utils" }

# crates.io `config` — load TOML/JSON/YAML and `.get()` / try_deserialize.
# Renamed so it doesn't clash with our EngineConfig crate.
settings = { package = "config", version = "0.15", default-features = false, features = [
    "toml",
    "json",
    "yaml",
] }
ahash = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
clap = { workspace = true }
cozy-chess = { workspace = true }
indicatif = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
ctrlc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "tuner"
path = "src/bin/tuner/main.rs"

[lints]
workspace = true
