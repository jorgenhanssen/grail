[package]
name = "grail"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = { workspace = true }
repository = { workspace = true }

[features]
default = []
tuning = ["uci/tuning", "search/tuning"]

[dependencies]
search = { path = "../search" }
nnue = { path = "../nnue" }
hce = { path = "../hce" }
uci = { path = "../uci" }
evaluation = { path = "../evaluation" }

ahash = { workspace = true }
cozy-chess = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }

[target.'cfg(all(any(target_arch = "x86", target_arch = "x86_64"), target_feature = "bmi2"))'.dependencies]
cozy-chess = { workspace = true, features = ["pext"] }

[lints]
workspace = true
