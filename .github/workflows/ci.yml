name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

env:
  # Force colored output in CI logs
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install plotters system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype6-dev libfontconfig1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test

  bench-hash:
    name: Verify bench hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # We only need the model (so books don't take up quota...)
      - run: git lfs pull --include="nnue/model.safetensors"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify bench hash
        run: |
          cargo build --release --bin grail
          bash scripts/bench-hash.sh
